<!DOCTYPE html>
<html lang="en">
<head>
	<meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/>
	<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1.0"/>
	<title>User Account</title>
	<meta name="description" content="User login and registration." />
	<!-- OPEN GRAPH -->
	
	<!-- CORE CSS  -->
	<link href="core/css/construct.css" type="text/css" rel="stylesheet" media="all"/>
	<style>
	h1{padding:0; margin: 0;}
	label {color: #fffff0; font-weight: 600;}
	</style>
</head>
<body class="notebook-paper">

<div class="container-960 bitstream">
	<header class="padded sapphire-t">
		<h1 class="fluid-text center bluu-next">User Account</h1>
	</header>
	<!-- Searchable User List -->
	<div class="padded sapphire-b b-b-k">
		<div class="tabs">
			<!-- LOGIN -->
			<input type="radio" name="useraccount" checked="checked" id="login">
			<label for="login">Login</label>
			<div class="tab">
				<div class="padded socialize b-s-k sapphire-b rounded">
					<form id="login1" class="validate flex" novalidate method="post" action="">
						<div class="half">
							<div class="form-group">
								<label for="username">Username</label><br />
								<input id="username" type="text" name="username" required class="form-control" />
							</div>
						</div><div class="half">
							<div class="form-group">
								<label for="pwd">Password</label><br />
								<input id="pwd" type="password" name="password" required class="form-control" />
							</div>
						</div><div class="full">
							<div class="form-group">
								<input type="submit" class="nb-btn" name="login" value="Login" />
							</div>
						</div>
					</form>
					<p class="spacer"></p>
				</div>
			</div>
			
			<!-- REGISTRATION -->
			<input type="radio" name="useraccount" id="reg">
			<label for="reg">Register</label>
			<div class="tab">
				<div class="padded socialize b-s-k sapphire-b rounded">
				<form id="newuser1" class="validate" novalidate method="post" action="">
					<div class="form-group">
						<label for="newUser">Username</label><br />
						<input id="newUser" type="text" name="newUsername" required class="form-control" />
					</div>
					<div class="form-group">
						<label>Email</label><br />
						<input id="userEmail" type="email" name="email" required class="form-control" />
					</div>
					<div class="flex"><div class="half">
						<div class="form-group">
							<label>Password</label><br />
							<input type="password" id="pwd" required data-pristine-required-message="Please choose a password" 
							data-pristine-pattern= "/^(?=.*?[A-Z])(?=.*?[a-z])(?=.*?[0-9]).{8,}$/" 
							data-pristine-pattern-message="Minimum 8 characters, at least one uppercase letter, one lowercase letter and one number" class="form-control" />
						</div>
					</div><div class="half">
						<div class="form-group">
							<label>Confirm Password</label><br />
							<input type="password" data-pristine-equals="#pwd" data-pristine-equals-message="Passwords don't match" class="form-control" />
						</div>
					</div></div>
					<div class="form-group">
						<input type="submit" class="nb-btn" name="register" value="Create Account" />
					</div>
				</form>
				<p class="spacer"></p>
				</div>
			</div>
		</div>
		
	</div>
	<p class="spacer"></p>
</div>

<footer class="padded center bitstream disabled">
	<p><a href="https://www.brutalistframework.com" target="_blank">Brutalist Framework</a> &copy; 2026</p>
</footer>

<!-- Vanilla Javascript -->
<script src="core/jab/fux/pristine.js" type="text/javascript"></script>
<script>
window.onload = function () {
   var form1 = document.getElementById("login1");
   var form2 = document.getElementById("newuser1");
   var pristine1 = new Pristine(form1);
   var pristine2 = new Pristine(form2);
   form1.addEventListener('submit', function (e) {
      e.preventDefault();
      var valid = pristine1.validate();
   });
    form2.addEventListener('submit', function (e) {
      e.preventDefault();
      var valid = pristine2.validate();
   });
};
</script>

</body>
</html>
